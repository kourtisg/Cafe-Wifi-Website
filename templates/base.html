<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cafe & Wifi{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand navbar-dark bg-coffee">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">
        <i class="bi bi-cup-hot-fill"></i> Cafe & Wifi
      </a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="{{ url_for('home') }}">Cafes</a>
        <a class="nav-link" href="{{ url_for('add_cafe') }}">Add a cafe</a>
      </div>
    </div>
  </nav>

  <main class="container my-4 flex-grow-1">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="py-3 bg-light border-top">
    <div class="container text-center text-muted small">
      Laptop-friendly cafes in London &middot; 100 Days of Code &middot; Day 88
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
